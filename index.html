<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WOD Log</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WOD Log">
<meta name="theme-color" content="#0e0f11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0f11; --card:#18191d; --card2:#212328; --line:#2b2e34;
  --text:#f3f3f1; --muted:#8d929b; --accent:#ff5b1f; --accent2:#ffb21f; --good:#3ddc84; --bad:#ff4d5e;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
h1,h2,h3{font-family:Inter,system-ui,sans-serif;letter-spacing:.02em;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox]{width:auto;accent-color:var(--accent);transform:scale(1.3)}
textarea{resize:vertical;min-height:60px}
.l{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px}
header h1{font-size:30px;font-weight:800;font-style:italic}
header h1 span{color:var(--accent)}
.gear{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:Inter,system-ui,sans-serif;font-size:28px;line-height:1}
.stat small{color:var(--muted);font-size:12px}
.status{font-size:13px;color:var(--accent2);background:#2a2110;border-radius:10px;padding:9px 12px;margin-bottom:12px;display:none}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h2{font-size:20px;font-weight:700;text-transform:uppercase}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row{display:flex;gap:8px;align-items:center}
.row > *{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:999px;background:var(--card2);font-weight:600;font-size:14px;color:#cfd1d4;border:1px solid transparent}
.chip.on{background:var(--accent);color:#fff}
.btn{background:var(--accent);color:#fff;font-weight:700;padding:14px;border-radius:12px;width:100%;text-transform:uppercase;letter-spacing:.04em;font-family:Inter,system-ui,sans-serif;font-size:20px}
.btn.ghost{background:var(--card2);color:var(--text);font-family:Inter;font-size:14px;text-transform:none;letter-spacing:0;padding:11px;font-weight:600}
.btn.dashed{background:none;border:1.5px dashed #3a3d44;color:var(--muted)}
.btn:active,.chip:active,.pl:active,.preset:active{transform:scale(.96)}
.small{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1em}
.hidden{display:none!important}
.stepper{display:flex;align-items:stretch;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:42px;font-size:22px;color:var(--accent);font-weight:600;flex:0 0 42px}
.stepper input{border:0;background:none;text-align:center;padding:10px 0;border-radius:0}
.plabel{font-family:Inter,system-ui,sans-serif;font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.1em;text-transform:uppercase}
.linkbtn{color:var(--muted);font-size:13px;font-weight:600}
.exrow{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--card2);border-radius:12px;padding:12px 14px;margin-top:8px;gap:10px}
.exrow b{display:block;font-size:15px}
.exrow .small{display:block;margin-top:2px;color:#b9bcc2}
.chev{color:var(--muted);font-size:22px}
.rpe{display:flex;align-items:center;gap:12px}
.rpe input{padding:0;background:none;border:0;accent-color:var(--accent)}
.rpe b{font-family:Inter,system-ui,sans-serif;font-size:26px;width:36px;text-align:center}
.view{display:none}.view.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(14,15,17,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav div{display:flex;max-width:560px;width:100%}
nav button{flex:1;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}
.month{font-family:Inter,system-ui,sans-serif;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px}
.entry{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:8px}
.entry .date{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.entry .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:8px}
.entry h3{font-size:21px;font-weight:700}
.entry .sub{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.score{font-family:Inter,system-ui,sans-serif;font-size:24px;font-weight:700;color:var(--accent);white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--card2);color:var(--muted);margin:6px 6px 0 0;text-transform:uppercase;letter-spacing:.04em}
.tag.rx{background:#13301f;color:var(--good)}
.tag.pr{background:#3a2208;color:var(--accent2)}
.exline{font-size:14px;margin-top:5px;color:#d6d7d9}
.exline b{font-weight:600}
.details{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;font-size:14px;color:#cfd1d4;white-space:pre-wrap}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{flex:1;padding:9px;border-radius:10px;background:var(--card2);font-weight:600;font-size:14px}
.actions button.del{color:var(--bad)}
.actions button.del.sure{background:var(--bad);color:#fff}
.empty{text-align:center;color:var(--muted);padding:36px 16px}
.empty b{display:block;font-family:Inter,system-ui,sans-serif;font-size:24px;color:var(--text);margin-bottom:6px}
.lrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px;width:100%;text-align:left}
.lrow:last-child{border-bottom:0}
.lrow .nm{font-weight:600}
.big{font-family:Inter,system-ui,sans-serif;font-size:24px;font-weight:700;color:var(--accent);text-align:right;line-height:1;white-space:nowrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tile{background:var(--card2);border-radius:12px;padding:12px}
.tile b{display:block;font-family:Inter,system-ui,sans-serif;font-size:26px;line-height:1.05}
.tile small{color:var(--muted);font-size:12px}
.rms{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rms span{font-size:12px;background:var(--card2);padding:4px 7px;border-radius:6px;color:#cfd1d4}
.rms span i{font-style:normal;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:40;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* full-screen editor */
.ed-bg{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
.ed-bg.on{display:flex}
.ed-bar{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.ed-bar b{font-family:Inter,system-ui,sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.ed-bar button{color:var(--muted);font-weight:600;min-width:60px;text-align:left}
.ed-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 24px}
.ed-inner{max-width:560px;margin:0 auto}
.ed-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.ed-foot .ed-inner{display:flex;gap:8px}
.ed-head{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px}
.ed-head h2{font-size:30px}
.eqtag{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pick{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 2px;border-bottom:1px solid var(--line);text-align:left;font-weight:500}
.pick small{color:var(--muted);font-size:12px}
.pickhead{font-family:Inter,system-ui,sans-serif;font-size:14px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin:18px 0 2px}
.setchips{display:flex;flex-wrap:wrap;gap:6px}
.sc{background:var(--card2);border-radius:10px;padding:7px 10px;font-size:14px;font-weight:600;border:1.5px solid transparent;text-align:center;min-width:54px}
.sc i{display:block;font-style:normal;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.sc.on{border-color:var(--accent)}
.sc.all{min-width:auto}
.pad{background:var(--card);border-radius:16px;padding:14px;margin-top:6px}
.pad-top{display:flex;align-items:baseline;gap:8px;justify-content:center}
.pad-top input{font-family:Inter,system-ui,sans-serif;font-size:52px;font-weight:800;text-align:right;background:none;border:0;padding:0;width:170px;color:var(--text)}
.pad-top span{font-family:Inter,system-ui,sans-serif;font-size:24px;color:var(--muted);font-weight:700}
.padbreak{text-align:center;font-size:13px;color:var(--muted);min-height:18px;margin-bottom:6px}
.plab{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 6px}
.plates{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pl{border-radius:10px;padding:12px 0;font-family:Inter,system-ui,sans-serif;font-size:20px;font-weight:800;text-align:center;color:#fff}
.pl small{display:block;font-family:Inter;font-size:9px;font-weight:600;opacity:.8;letter-spacing:.05em}
.p25{background:#d6343b}.p20{background:#2a6fd6}.p15{background:#e8c21d;color:#1a1a1a}.p10{background:#2f9d55}.p5{background:#ececec;color:#1a1a1a}
.pfrac{background:#3a3d44}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.preset{background:var(--card2);border-radius:10px;padding:12px 0;font-family:Inter,system-ui,sans-serif;font-size:21px;font-weight:700;text-align:center;border:1.5px solid transparent}
.preset.on{border-color:var(--accent);color:var(--accent)}
.fine{display:flex;align-items:center;gap:8px}
.fine > button{width:52px;height:46px;border-radius:12px;background:var(--card2);font-size:26px;color:var(--accent);font-weight:600;flex:0 0 52px}
.fine .chips{flex:1;justify-content:center}
.fine .chip{padding:7px 10px;font-size:13px}
.padact{display:flex;gap:8px;margin-top:10px}
.padact button{flex:1;padding:9px;border-radius:10px;background:var(--card2);font-weight:600;font-size:13px;color:#cfd1d4}
.edtotal{background:var(--card);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px;color:#cfd1d4}
.edtotal b{color:var(--text)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.backbtn{color:var(--accent);font-weight:600;margin-bottom:6px;font-size:15px}
.check{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:#cfd1d4}
.sesshead{padding:2px 0 12px}
.titlein{background:none;border:0;border-bottom:1.5px solid transparent;border-radius:0;padding:4px 0;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:24px;color:var(--text)}
.titlein:focus{border-bottom-color:var(--accent)}
.titlein::placeholder{color:var(--text);opacity:1}
.titlein.big{font-size:30px}
.dateline{position:relative;color:var(--muted);font-size:14px;font-weight:600;padding:2px 0}
.dateline input{position:absolute;inset:0;opacity:0;width:100%;padding:0;border:0}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.addtile{background:var(--card);border:1.5px dashed #3a3d44;border-radius:var(--r);padding:18px 14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.addtile svg{width:28px;height:28px;color:var(--accent);margin-bottom:4px}
.addtile b{font-family:Inter,system-ui,sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.addtile span{font-size:12px;color:var(--muted)}
.addtile:active{transform:scale(.97)}
.btitle{font-size:26px;margin-top:2px}
.srow{display:grid;grid-template-columns:26px 1fr 1fr 52px;gap:8px;align-items:center;margin-top:8px}
.srow.shd{margin-top:14px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.sn{text-align:center;font-family:Inter,system-ui,sans-serif;font-size:20px;font-weight:700;color:var(--muted)}
.wbtn{background:var(--card2);border:1px solid var(--line);border-radius:10px;height:46px;font-family:Inter,system-ui,sans-serif;font-size:22px;font-weight:700}
.wbtn:disabled{color:var(--muted)}
.dim{color:#5d6168}
.rin{height:46px;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:22px;font-weight:700;padding:0 8px}
.rin::placeholder{color:#5d6168}
.tick{height:46px;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:#5d6168;font-size:22px;font-weight:800}
.srow.done .tick{background:var(--good);border-color:var(--good);color:#0e0f11}
.srow.done .wbtn,.srow.done .rin{background:#13301f;border-color:#1f4d31}
.srow.done .sn{color:var(--good)}
.wstitle{font-family:Inter,system-ui,sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
#wsVal{font-family:Inter,system-ui,sans-serif;font-size:56px;font-weight:800;color:var(--text)}
.barsvg{width:100%;height:auto;display:block;margin:4px 0}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.keypad button{background:var(--card2);border-radius:12px;padding:15px 0;font-size:24px;font-weight:600}
.keypad button:active{background:#33363d}
.bwtxt{font-size:40px!important}
.bwl{font-family:Inter,sans-serif;font-size:14px;font-weight:600}
.nobarbox{aspect-ratio:320/82;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;border:1.5px dashed #2b2e34;border-radius:12px}
.keepspace{visibility:hidden}
.pad-top{height:72px;align-items:center!important}
#wsVal{line-height:1}
#wsheet{align-items:center;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
#wsheet .wsheet{border-radius:20px;padding:14px 14px 14px;max-height:100%;overflow-y:auto}
#wsheet .pad-top{height:58px}
#wsheet #wsVal{font-size:48px}
#wsheet .bwtxt{font-size:36px!important}
#wsheet .plab{margin:8px 0 5px}
#wsheet .pl{padding:8px 0;font-size:18px}
#wsheet .padbreak{margin-bottom:4px;min-height:16px;font-size:12px}
#wsheet .padact{margin-top:8px}
#wsheet .padact button{padding:8px}
#wsheet .chip{padding:7px 11px;font-size:13px}
#wsheet .keypad button{padding:13px 0}
#wsheet #wsOk{margin-top:10px!important;padding:12px}
.dbgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#wsheet .dbgrid .preset{padding:10px 0}
.xbtn{width:32px;height:32px;border-radius:50%;background:var(--card2);color:var(--muted);font-size:22px;line-height:1;display:grid;place-items:center;flex:0 0 32px}
.addrow{display:flex;justify-content:center;margin-top:14px}
.addrow button{color:var(--accent);font-weight:700;font-size:15px;padding:10px 20px;border-radius:999px;background:rgba(255,91,31,.12)}
.sw{position:relative;overflow:hidden;border-radius:10px;margin-top:8px}
.sw .srow,.sw .exrow{margin-top:0}
.sw-del{position:absolute;right:0;top:0;bottom:0;width:84px;background:var(--bad);color:#fff;font-weight:700;font-size:14px}
.sw-c{position:relative;z-index:1;background:var(--card);transition:transform .22s ease;touch-action:pan-y}
.lirow{border-radius:0;margin:0;border-bottom:1px solid var(--line)}
.lirow .sw-c{background:var(--bg)}
.li{display:block;width:100%;text-align:left;padding:14px 2px}
.li-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.li-top b{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-top span{font-size:13px;color:var(--muted);flex:0 0 auto}
.li-prev{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prdot{color:var(--accent2);font-weight:600}
.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;font-size:34px;line-height:1;box-shadow:0 6px 22px rgba(255,91,31,.45);z-index:6;display:grid;place-items:center}
.fab:active{transform:scale(.94)}
.snack{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:#2b2e34;color:var(--text);border-radius:12px;padding:8px 8px 8px 16px;display:flex;gap:14px;align-items:center;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:41;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.snack.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.snack button{color:var(--accent);font-weight:700;padding:6px 10px}
.logempty{padding:90px 20px}
.sesshead{padding:0 0 12px}
.sesshead .titlein{text-align:left;width:100%}
.dateline{display:inline-block}
.wrap{padding-top:14px}
.listtop{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.listtop input{flex:1}
.gear{flex:0 0 44px;width:44px;height:44px}
.fab svg{display:block}
.sesslayer{position:fixed;inset:0;z-index:7;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(12px + env(safe-area-inset-top)) 0 calc(100px + env(safe-area-inset-bottom));box-shadow:0 0 40px rgba(0,0,0,.55)}
.sesswrap{max-width:560px;margin:0 auto;padding:0 16px}
nav{z-index:8}
.circback{width:38px;height:38px;border-radius:50%;background:var(--card2);color:var(--text);display:grid;place-items:center;margin-bottom:8px}
.circback:active{transform:scale(.92)}
@keyframes upIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes downOut{from{transform:none}to{transform:translateY(100%)}}

      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

    }

  persistLocal() { try { localStorage.setItem('wodlog.v1', JSON.stringify({ workouts:sessions, settings })); } catch (e) {} },
  async save(s) {
    await this.ready;

    else { const i = sessions.findIndex(x => x.id === s.id); if (i >= 0) sessions[i] = s; else sessions.push(s); this.persistLocal(); renderAll(); }

    const x = { name:item.name, equip:item.equip, unit:unitsFor(item).includes(item.unit) ? item.unit : unitsFor(item)[0], impl:1, mode:'same', reps:'', count:p.rounds, start:'', step:1, list:'', sets:[], linked:true };
    if (p.ladder) Object.assign(x, { mode:'ladder', start:p.ladder.start, step:p.ladder.step });
    regen(x); p.ex.push(x);
    closeEditor(); rerenderPart(pi); stashDraft();
    if (p.ladder) { const E = EQ[x.equip] || EQ.other; if (!E.noWeight && !E.optional) openCondWeight(pi, p.ex.length - 1); }
    else openCondReps(pi, p.ex.length - 1);  // straight on to reps
    return;
  }
  const p = draft.parts[ed.pi];
  if (ed.d) {  // changing exercise on an existing entry: keep the scheme
    ed.d.name = item.name; ed.d.equip = item.equip; ed.d.unit = item.unit || 'reps';
    if (!EQ[item.equip].impl) ed.d.impl = 1;
  } else {
    ed.d = { name:item.name, equip:item.equip, unit:item.unit || 'reps', impl:1, mode:'same', reps:'', count:p.rounds, start:'', step:1, list:'', sets:[], linked:true };
    regen(ed.d);
  }
  ed.view = 'edit'; ed.sel = 'all'; initPad(commonW(ed.d));
  renderEditor();
}

function renderScheme() {
  const d = ed.d, p = draft.parts[ed.pi], cLabel = FORMATS[p.format].count;
  let h = '';
  if (d.mode === 'same') h = `<div class="grid2"><div><label class="l">${cLabel}</label>${stepper('data-ek="count"', d.count)}</div><div><label class="l">Reps each</label>${stepper('data-ek="reps"', d.reps, '0')}</div></div>`;
  else if (d.mode === 'ladder') h = `<div class="grid3"><div><label class="l">${cLabel}</label>${stepper('data-ek="count"', d.count)}</div><div><label class="l">Start</label>${stepper('data-ek="start"', d.start, '0')}</div><div><label class="l">+ per round</label>${stepper('data-ek="step"', d.step)}</div></div>`;
  else h = `<label class="l">Reps per round</label><input id="edList" value="${esc(d.list)}" placeholder="e.g. 21-15-9 or 3,4,5,6,7" inputmode="text" autocomplete="off">`;
  $('#edScheme').innerHTML = h;
  $$('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === d.mode));
}
function renderSets() {
  const d = ed.d, E = EQ[d.equip] || EQ.other;
  if (ed.sel !== 'all' && ed.sel >= d.sets.length) ed.sel = 'all';
  const wTxt = w => E.noWeight ? '' : ` · ${w ? num(w) : '—'}`;

function renderTotal() {

  const t = exTotals(d);
  $('#edTotal').innerHTML = `<b>${esc(schemeStr(d))}</b><br>Total ${t.reps}${unitSfx(d.unit) || ' reps'}${t.ton ? ` · ${num(t.ton)} kg moved` : ''}`;
}

// ---- weight pad ----
function initPad(w) {
  pad.bar = settings.bar ?? 20; pad.plates = []; pad.active = w > 0; pad.adj = w > 0 ? w - pad.bar : 0; pad.val = w || 0;
}
function padTotal() {
  if (ed.d.equip === 'barbell') return pad.active ? Math.max(0, r2(pad.bar + 2 * sum(pad.plates) + pad.adj)) : 0;
  return Math.max(0, r2(pad.val));
}
function padBreak() {
  if (ed.d.equip !== 'barbell' || !pad.active) return '';
  if (!pad.plates.length) return pad.adj ? '' : `Empty ${pad.bar ? pad.bar + ' kg bar' : 'bar'}`;
  const base = num(pad.bar + pad.adj);
  return `${pad.adj ? base + ' kg' : pad.bar + ' bar'} + 2 × (${pad.plates.join(' + ')})`;
}
function renderPad() {
  // conditioning: a button showing the weight for the selected rounds; tap opens the shared weight popup
  const d = ed.d, b = $('#edW'); if (!b) return;
  const w = ed.sel === 'all' || d.sets.length === 1 ? commonW(d) : d.sets[ed.sel].w;
  const E = EQ[d.equip] || EQ.other;
  const txt = w > 0 ? `${IMPL[d.equip] && IMPL[d.equip].dual && d.impl === 2 ? '2 × ' : ''}${num(w)} kg` : (d.equip === 'barbell' || E.optional) && d.wset ? 'Bodyweight' : 'Set weight';
  b.innerHTML = `<span>${txt}</span><i>›</i>`;
  b.classList.toggle('empty', !(w > 0));
}
function renderPadOld() {
  const d = ed.d, E = EQ[d.equip] || EQ.other, t = padTotal();
  const steps = [0.25, 0.5, 1, 2.5];
  const fine = `<div class="plab">Fine adjust</div><div class="fine"><button data-fine="-1">−</button><div class="chips">${steps.map(s => `<button class="chip ${settings.step === s ? 'on' : ''}" data-stepsz="${s}">${s}</button>`).join('')}</div><button data-fine="1">+</button></div>`;
  let h = `<div class="pad-top"><input id="padVal" inputmode="decimal" value="${t || ''}" placeholder="0"><span>kg</span></div><div class="padbreak" id="padBreak">${esc(padBreak())}</div>`;
  if (d.equip === 'barbell') {
    h += `<div class="plab">Bar</div><div class="chips">${[20, 15, 10, 0].map(b => `<button class="chip ${pad.bar === b ? 'on' : ''}" data-bar="${b}">${b ? b + ' kg' : 'No bar'}</button>`).join('')}</div>
      <div class="plab">Bumper plates — tap to load a pair</div>
      <div class="plates">${[25, 20, 15, 10, 5].map(x => `<button class="pl p${x}" data-plate="${x}">${x}<small>KG</small></button>`).join('')}</div>
      <div class="plab">Change plates</div>
      <div class="plates">${[2.5, 2, 1.25, 0.5, 0.25].map(x => `<button class="pl pfrac" data-plate="${x}">${x}<small>KG</small></button>`).join('')}</div>
      ${fine}

  } else {
    h += `<div class="plab">${E.label} weights</div><div class="presets">${E.presets.map(x => `<button class="preset ${t === x ? 'on' : ''}" data-preset="${x}">${x}</button>`).join('')}</div>
      ${fine}<div class="padact"><button id="padClear">${E.optional ? 'No added weight' : 'Clear'}</button></div>`;

}
function applyPad(rerender = true) {
  const d = ed.d, t = padTotal();
  if (ed.sel === 'all' || d.sets.length === 1) d.sets.forEach(s => s.w = t); else d.sets[ed.sel].w = t;
  if (rerender) renderPad(); else { const b = $('#padBreak'); if (b) b.textContent = padBreak(); $$('#edPad .preset').forEach(x => x.classList.toggle('on', +x.dataset.preset === t)); }
  renderSets(); renderTotal();
}

function edSet(k, v) {
  const d = ed.d;
  if (k === 'setreps') {
    d.sets[ed.sel].r = Math.max(0, parseFloat(v) || 0);
    d.mode = 'list'; d.list = d.sets.map(s => s.r).join('-');
    renderScheme(); renderSets(); renderTotal(); return;
  }
  if (k === 'count') d.count = clampInt(v, 1, 100);
  else if (k === 'step') d.step = v === '' || v === '-' ? v : (parseFloat(v) || 0);
  else d[k] = v === '' ? '' : Math.max(0, parseFloat(v) || 0);
  regen(d); renderSets(); renderTotal();
}

const edEl = $('#ed');
edEl.addEventListener('change', e => {
  if (e.target.id === 'cxTick' && ed) { ed.cx = e.target.checked; ed.cxList = []; renderPickList(); renderCxSel(); }
});
edEl.addEventListener('input', e => {
  const t = e.target; if (!ed) return;
  if (t.id === 'exSearch') { ed.q = t.value; renderPickList(); return; }
  if (t.dataset.ek) { edSet(t.dataset.ek, t.value); return; }
  if (t.id === 'edList') { ed.d.list = t.value; regen(ed.d); renderSets(); renderTotal(); return; }
  if (t.id === 'padVal') {
    const v = Math.max(0, parseFloat(t.value) || 0);
    if (ed.d.equip === 'barbell') { pad.plates = []; pad.active = v > 0; pad.adj = v - pad.bar; } else pad.val = v;
    applyPad(false);
  }
});
edEl.addEventListener('click', async e => {
  const t = e.target; if (!ed) return;
  if ((ed.mode === 'strength' || ed.mode === 'cond') && t.id === 'ed') { closeEditor(); return; }
  if (t.closest('#edCancel')) { if (ed.view === 'pick' && ed.d) { ed.view = 'edit'; renderEditor(); } else closeEditor(); return; }
  const cat = t.closest('[data-cat]');

  const pk = t.closest('[data-pick]');
  if (pk && ed.cx) {
    const item = allExercises()[norm(pk.dataset.pick)]; if (!item) return;
    ed.cxList = ed.cxList || [];
    const i = ed.cxList.findIndex(e => norm(e.name) === norm(item.name));
    if (i >= 0) ed.cxList.splice(i, 1); else ed.cxList.push(item);
    renderPickList(); renderCxSel(); return;
  }
  if (pk) { const item = allExercises()[norm(pk.dataset.pick)]; if (item) choose(item); return; }
  if (t.closest('#cxOk')) {
    const L = ed.cxList || [];
    if (!L.length) { toast('Pick the exercises in order first'); return; }
    if (L.length === 1) { ed.cx = false; choose(L[0]); return; }
    const equip = L.every(e => e.equip === L[0].equip) ? L[0].equip : (L.some(e => e.equip === 'barbell') ? 'barbell' : L[0].equip);
    const part = strengthPart(L.map(e => e.name).join(' + '), equip, 'reps', [0, 1, 2].map(() => ({ r:0, w:null, done:false })));
    part.ex[0].complex = L.map(e => e.name);
    draft.parts.push(part);
    closeEditor(); renderLog(); stashDraft(); scrollToPart(draft.parts.length - 1); return;
  }
  const ne = t.closest('[data-neweq]');
  if (ne) {
    const eq = ne.dataset.neweq, item = { name: ed.q.trim(), equip: eq, unit: eq === 'cardio' ? 'cal' : 'reps' };
    settings.custom = [...(settings.custom || []).filter(c => norm(c.name) !== norm(item.name)), item];
    Store.saveSettings().catch(() => {});
    choose(item); return;
  }
  if (t.closest('#edChange')) { ed.view = 'pick'; ed.q = ''; renderEditor(); return; }
  if (t.closest('#edRemove')) { draft.parts[ed.pi].ex.splice(ed.j, 1); const pi = ed.pi; closeEditor(); renderLog(); stashDraft(); return; }
  if (t.closest('#edDone')) return edDone();
  const d = ed.d; if (!d) return;
  const stp = t.closest('[data-stp]');
  if (stp) {
    const inp = stp.parentElement.querySelector('input'), k = inp.dataset.ek;
    const cur = parseFloat(inp.value) || 0;
    let nv = cur + +stp.dataset.stp;
    if (k === 'count') nv = Math.max(1, nv); else if (k !== 'step') nv = Math.max(0, nv);
    inp.value = nv; edSet(k, nv); return;
  }
  const mb = t.closest('[data-mode]');
  if (mb) {
    const m = mb.dataset.mode; if (m === d.mode) return;
    if (m === 'list') d.list = d.sets.map(s => s.r).join('-');
    if (m === 'same') { d.reps = d.sets[0] ? d.sets[0].r : ''; d.count = d.sets.length || draft.parts[ed.pi].rounds; }
    if (m === 'ladder') { d.start = d.sets[0] ? d.sets[0].r : ''; d.step = d.sets[1] ? r2(d.sets[1].r - d.sets[0].r) || 1 : 1; d.count = d.sets.length || draft.parts[ed.pi].rounds; }
    d.mode = m; regen(d); renderScheme(); renderSets(); renderTotal(); return;
  }
  const ub = t.closest('[data-unit]');
  if (ub) { d.unit = ub.dataset.unit; $$('#unitChips .chip').forEach(c => c.classList.toggle('on', c.dataset.unit === d.unit)); renderSets(); renderTotal(); return; }
  const ib = t.closest('[data-impl]');
  if (ib) { d.impl = +ib.dataset.impl; $$('#implSeg button').forEach(b => b.classList.toggle('on', +b.dataset.impl === d.impl)); renderSets(); renderTotal(); return; }
  if (t.closest('#edW')) {
    const all = ed.sel === 'all' || d.sets.length === 1, cur = all ? commonW(d) : d.sets[ed.sel].w;
    const w0 = cur > 0 ? cur : d.equip === 'barbell' && !d.wset ? (d.bar ?? 20) : 0;
    openWeightFor(d, w0, `${d.name} · ${all ? 'all rounds' : 'round ' + (ed.sel + 1)}`, v => {
      if (all) d.sets.forEach(st => st.w = v); else d.sets[ed.sel].w = v;
      d.wset = true; renderSets(); renderPad(); renderTotal();
    });
    return;
  }
  const sc = t.closest('[data-s]');
  if (sc) { ed.sel = sc.dataset.s === 'all' ? 'all' : +sc.dataset.s; renderSets(); renderPad(); return; }
  // pad
  const bb = t.closest('[data-bar]');
  if (bb) { pad.bar = +bb.dataset.bar; pad.active = true; settings.bar = pad.bar; applyPad(); return; }
  const pb = t.closest('[data-plate]');
  if (pb) { if (!pad.active) { pad.active = true; pad.adj = 0; pad.plates = []; } pad.plates.push(+pb.dataset.plate); applyPad(); return; }
  const pr = t.closest('[data-preset]');
  if (pr) { pad.val = +pr.dataset.preset; applyPad(); return; }
  const fn = t.closest('[data-fine]');
  if (fn) {
    const delta = +fn.dataset.fine * (settings.step || 0.25);
    if (d.equip === 'barbell') { if (!pad.active) { pad.active = true; pad.plates = []; pad.adj = -pad.bar; } pad.adj = r2(pad.adj + delta); if (padTotal() <= 0 && delta < 0) { pad.active = false; pad.adj = 0; pad.plates = []; } }
    else pad.val = Math.max(0, r2(pad.val + delta));
    applyPad(); return;
  }
  const sz = t.closest('[data-stepsz]');
  if (sz) { settings.step = +sz.dataset.stepsz; $$('[data-stepsz]').forEach(c => c.classList.toggle('on', +c.dataset.stepsz === settings.step)); return; }
  if (t.closest('#padUndo')) { pad.plates.pop(); if (!pad.plates.length && !pad.adj) pad.active = pad.active && true; applyPad(); return; }
  if (t.closest('#padClear')) { pad.plates = []; pad.adj = 0; pad.active = false; pad.val = 0; applyPad(); return; }
});
function edDone() {
  const d = ed.d;
  if (!d.sets.length || !d.sets.some(s => s.r > 0)) { $('#edErr').textContent = 'Enter the reps (or cal / metres) for this exercise.'; return; }
  const p = draft.parts[ed.pi];
  d.linked = d.mode !== 'list' && d.count === p.rounds;
  if (ed.j == null) p.ex.push(d); else p.ex[ed.j] = d;
  closeEditor(); renderLog(); stashDraft();
  Store.saveSettings().catch(() => {});  // remember bar/step choice
}

// ================= INDEX (PRs, exercise stats) =================
function computeIndex() {
  const ex = {}, wods = {}, flags = {};
  const sorted = [...sessions].sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0));
  for (const s of sorted) {
    const f = flags[s.id] = [];
    s.parts.forEach(p => {
      p.ex.forEach(x => {
        x = exLive(x); if (!x.sets.length) return;
        const k = norm(x.name);
        const E = ex[k] ||= { key:k, name:x.name, equip:x.equip, occ:[], maxW:0, maxWDate:null, rm:{}, e1:0, totals:{}, ton:0, last:null };
        E.equip = x.equip;
        const t = exTotals(x);
        if (t.mw > 0 && E.maxW > 0 && t.mw > E.maxW + 1e-9) f.push(`${x.name} — heaviest`);
        if (t.mw > E.maxW) { E.maxW = t.mw; E.maxWDate = s.date; }
        if (p.format === 'strength' && x.equip === 'barbell' && !x.complex) {
          x.sets.forEach(st => {
            if (!st.w || st.r > 10 || st.r < 1) return;
            const prev = E.rm[st.r];
            if (!prev || st.w > prev.w + 1e-9) { if (prev && !f.includes(`${x.name} ${st.r}RM`)) f.push(`${x.name} ${st.r}RM`); E.rm[st.r] = { w:st.w, date:s.date }; }
            E.e1 = Math.max(E.e1, e1rm(st.w, st.r));
          });
        }
        E.totals[x.unit] = (E.totals[x.unit] || 0) + t.reps;
        E.ton += t.ton; E.last = s.date;
        E.occ.push({ date:s.date, sid:s.id, ctx:(p.name ? p.name + ' · ' : '') + fmtLabel(p), scheme:schemeStr(x), reps:t.reps, unit:x.unit, ton:t.ton, mw:t.mw });
      });
      if (p.name) {
        const v = scoreVal(p);
        if (v != null) {
          const k = norm(p.name) + '|' + p.format + '|' + (p.rx ? 'rx' : 'sc');
          const W = wods[k] ||= { key:k, name:p.name, format:p.format, rx:p.rx, best:null, hist:[] };
          if (W.best && v > W.best.v) f.push(`${p.name}${p.rx ? ' Rx' : ''}`);
          if (!W.best || v > W.best.v) W.best = { v, part:p, date:s.date };
          W.hist.push({ date:s.date, v, part:p });
        }
      }
    });
  }
  idx = { ex, wods, flags };
}

let exSel = null, exMetric = 'weight', exQ = '';
function renderExercises() {
  const el = $('#exView');
  if (exSel && idx.ex[exSel]) {
    const E = idx.ex[exSel], eq = EQ[E.equip] || EQ.other;
    const mainUnit = Object.entries(E.totals).sort((a, b) => b[1] - a[1])[0] || ['reps', 0];
    const rms = Object.keys(E.rm).map(Number).sort((a, b) => a - b);
    const occ = [...E.occ].reverse();
    const metrics = eq.noWeight ? [['volume', 'Volume']] : [['weight', 'Heaviest'], ['volume', 'Volume'], ['ton', 'Tonnage']];
    if (!metrics.some(m => m[0] === exMetric)) exMetric = metrics[0][0];
    const byDate = {};
    E.occ.forEach(o => { const v = exMetric === 'weight' ? o.mw : exMetric === 'volume' ? o.reps : o.ton; byDate[o.date] = exMetric === 'weight' ? Math.max(byDate[o.date] || 0, v) : (byDate[o.date] || 0) + v; });
    const pts = Object.keys(byDate).sort().map(d => ({ date:d, y:byDate[d] })).filter(p => exMetric !== 'weight' || p.y > 0);
    el.innerHTML = `<button class="backbtn" id="exBack">‹ All exercises</button>
      <div class="card">
        <div class="eqtag">${eq.label}</div><h2 style="font-size:28px;text-transform:none">${esc(E.name)}</h2>
        <div class="tiles">
          ${eq.noWeight ? '' : `<div class="tile"><b>${E.maxW ? fmtW(E.maxW) : '—'}</b><small>heaviest${E.maxWDate ? ' · ' + fmtShort(E.maxWDate) : ''}</small></div>`}
          <div class="tile"><b>${E.occ.length}</b><small>times done</small></div>
          <div class="tile"><b>${num(mainUnit[1])}</b><small>total ${mainUnit[0]}</small></div>
          ${E.ton ? `<div class="tile"><b>${Math.round(E.ton).toLocaleString('en-GB')}</b><small>kg moved total</small></div>` : ''}
          ${E.e1 ? `<div class="tile"><b>${num(Math.round(E.e1 * 2) / 2)} kg</b><small>est. 1RM</small></div>` : ''}
        </div>
        ${rms.length ? `<div class="plab" style="margin-top:14px">Rep maxes (strength sets)</div><div class="rms">${rms.map(r => `<span><i>${r}RM</i> ${fmtW(E.rm[r].w)}</span>`).join('')}</div>` : ''}
      </div>
      <div class="card">
        <div class="seg" id="exMetric">${metrics.map(([k, l]) => `<button data-m="${k}" class="${exMetric === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        ${chartSVG(pts, { fmt: y => exMetric === 'volume' ? Math.round(y) : num(Math.round(y)), label: exMetric === 'weight' ? 'Heaviest weight per session (kg)' : exMetric === 'volume' ? `Total ${mainUnit[0]} per session` : 'Total kg moved per session' })}
      </div>
      <div class="card"><h2>Every time you did it</h2>
        ${occ.map(o => `<div class="lrow"><div><div class="nm">${esc(o.scheme)}</div><div class="small">${fmtShort(o.date)} · ${esc(o.ctx)}</div></div><div class="big" style="font-size:20px">${num(o.reps)}<span class="small"> ${o.unit}</span></div></div>`).join('')}
      </div>`;
    return;
  }
  const items = Object.values(idx.ex).filter(E => !exQ || norm(E.name).includes(norm(exQ))).sort((a, b) => (b.last || '').localeCompare(a.last || '') || a.name.localeCompare(b.name));
  el.innerHTML = `<input id="exQ" placeholder="Search exercises" value="${esc(exQ)}" style="margin-bottom:12px">
    <div class="card">${items.length ? items.map(E => `<button class="lrow" data-ex="${esc(E.key)}"><div><div class="nm">${esc(E.name)}</div><div class="small">${(EQ[E.equip] || EQ.other).label} · ${E.occ.length}× · last ${fmtShort(E.last)}</div></div><div class="big" style="font-size:20px">${E.maxW ? fmtW(E.maxW) : '›'}</div></button>`).join('')
      : `<div class="empty" style="padding:20px 0">${Object.keys(idx.ex).length ? 'No matches.' : 'Exercises you log will appear here with their history and PRs.'}</div>`}</div>`;
}

});
$('#exView').addEventListener('input', e => {
  if (e.target.id !== 'exQ') return;
  exQ = e.target.value; const pos = e.target.selectionStart;
  renderExercises(); const i = $('#exQ'); i.focus(); i.setSelectionRange(pos, pos);
});

// ================= PROGRESS =================
let wodSel = '';
function renderProgress() {
  const n = 10, ws = weekStart(new Date());
  const weeks = Array.from({ length:n }, (_, i) => { const d = new Date(ws); d.setDate(d.getDate() - (n - 1 - i) * 7); return d; });
  const counts = weeks.map(d => { const e = new Date(d); e.setDate(e.getDate() + 7); return sessions.filter(s => { const x = parseDate(s.date); return x >= d && x < e; }).length; });
  const W = 340, H = 120, pb = 20, max = Math.max(4, ...counts), bw = W / n;
  const weekSvg = `<svg class="chart" viewBox="0 0 ${W} ${H}">${counts.map((c, i) => { const h = (H - pb - 14) * c / max, x = i * bw + 5, y = H - pb - h;
    return `<rect x="${x}" y="${y}" width="${bw - 10}" height="${Math.max(h, 2)}" rx="4" fill="${i === n - 1 ? '#ff5b1f' : '#3a3d44'}"/>${c ? `<text x="${x + (bw - 10) / 2}" y="${y - 4}" fill="#f3f3f1" font-size="11" text-anchor="middle" font-weight="600">${c}</text>` : ''}<text x="${x + (bw - 10) / 2}" y="${H - 5}" fill="#8d929b" font-size="9" text-anchor="middle">${weeks[i].getDate()}/${weeks[i].getMonth() + 1}</text>`; }).join('')}</svg>`;

  const prs = [];
  [...sessions].sort((a, b) => b.date.localeCompare(a.date)).forEach(s => (idx.flags[s.id] || []).forEach(f => prs.push({ date:s.date, f })));

  const wl = Object.values(idx.wods).sort((a, b) => a.name.localeCompare(b.name));
  if (!wl.some(w => w.key === wodSel)) wodSel = wl[0] ? wl[0].key : '';
  let wodChart = '';
  if (wodSel) {
    const w = idx.wods[wodSel], isT = w.format === 'time';
    const pts = w.hist.filter(h => !(isT && h.part.score.capped)).map(h => ({ date:h.date, y: isT ? h.part.score.timeSec : w.format === 'load' ? h.part.score.load : (h.part.score.rounds || 0) + (h.part.score.reps || 0) / 100 }));
    wodChart = `<div class="between" style="margin-top:12px"><span class="small">Best · ${fmtShort(w.best.date)}</span><span class="big">${esc(scoreStr(w.best.part))}</span></div>` +
      chartSVG(pts, { fmt: y => isT ? fmtTime(Math.max(0, y)) : num(Math.round(y * 10) / 10), label: isT ? 'Finish time — lower is better' : w.format === 'load' ? 'Load (kg)' : 'Rounds (extra reps as decimals)' });
  }
  $('#progView').innerHTML = `
    <div class="card"><h2>Consistency</h2><div class="small">Sessions per week, last 10 weeks</div>${weekSvg}</div>
    <div class="card"><h2>Recent PRs</h2>${prs.length ? prs.slice(0, 12).map(p => `<div class="lrow"><span class="nm">🏆 ${esc(p.f)}</span><span class="small">${fmtShort(p.date)}</span></div>`).join('') : `<div class="small" style="margin-top:6px">PRs show up once you beat a previous best.</div>`}</div>
    <div class="card"><h2>Named WODs</h2><div class="small">Give a WOD a name to compare repeat attempts</div>
      ${wl.length ? `<select id="wodSel" style="margin-top:10px">${wl.map(w => `<option value="${esc(w.key)}" ${w.key === wodSel ? 'selected' : ''}>${esc(w.name)} · ${FORMATS[w.format].label} · ${w.rx ? 'Rx' : 'Scaled'} (${w.hist.length})</option>`).join('')}</select>${wodChart}` : ''}
    </div>`;
}
$('#progView').addEventListener('change', e => { if (e.target.id === 'wodSel') { wodSel = e.target.value; renderProgress(); } });

function chartSVG(points, { fmt, label }) {
  const W = 340, H = 180, pl = 44, pr = 12, pt = 14, pb = 26;
  if (!points.length) return `<div class="empty" style="padding:24px 0">Nothing to chart yet.</div>`;
  const xs = points.map(p => parseDate(p.date).getTime()), ys = points.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 864e5; x1 += 864e5; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const padY = (y1 - y0) * 0.15 || Math.abs(y1) * 0.1 || 1; y0 = Math.max(0, y0 - padY); y1 += padY;
  const X = x => pl + (x - x0) / (x1 - x0) * (W - pl - pr), Y = y => pt + (1 - (y - y0) / (y1 - y0)) * (H - pt - pb);
  const ticks = [0, .5, 1].map(t => y0 + t * (y1 - y0));
  const path = points.map((p, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area = path + `L${X(xs[xs.length - 1]).toFixed(1)},${H - pb}L${X(xs[0]).toFixed(1)},${H - pb}Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff5b1f" stop-opacity=".35"/><stop offset="1" stop-color="#ff5b1f" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="#2b2e34"/><text x="${pl - 6}" y="${Y(t) + 4}" fill="#8d929b" font-size="10" text-anchor="end">${esc(fmt(t))}</text>`).join('')}
    ${points.length > 1 ? `<path d="${area}" fill="url(#g)"/><path d="${path}" fill="none" stroke="#ff5b1f" stroke-width="2.5" stroke-linejoin="round"/>` : ''}
    ${points.map((p, i) => `<circle cx="${X(xs[i])}" cy="${Y(p.y)}" r="4" fill="#0e0f11" stroke="#ff5b1f" stroke-width="2"/>`).join('')}
    <text x="${pl}" y="${H - 6}" fill="#8d929b" font-size="10">${fmtShort(points[0].date)}</text>
    <text x="${W - pr}" y="${H - 6}" fill="#8d929b" font-size="10" text-anchor="end">${fmtShort(points[points.length - 1].date)}</text></svg>
    <div class="small" style="margin-top:4px">${esc(label)}</div>`;
}

// ================= shell =================
function renderStats() {
  const ws = weekStart(new Date()), m = todayStr().slice(0, 7);
  $('#sWeek').textContent = sessions.filter(s => parseDate(s.date) >= ws).length;
  $('#sTotal').textContent = sessions.length;
  $('#sMonth').textContent = sessions.filter(s => s.date.startsWith(m)).reduce((n, s) => n + (idx.flags[s.id] || []).length, 0);
}
function renderCustom() {
  const c = settings.custom || [];
  $('#customList').innerHTML = c.length ? c.map((x, i) => `<div class="lrow"><span>${esc(x.name)} <span class="small">· ${(EQ[x.equip] || EQ.other).label}</span></span><button class="linkbtn" data-rmc="${i}" style="color:var(--bad)">Remove</button></div>`).join('') : `<div class="small">None yet — type a new name when adding an exercise.</div>`;
}
function renderAll() { computeIndex(); if ($('#listBody') && !!$('#lSearch') === !!sessions.length) renderListBody(); else renderList(); renderExercises(); renderProgress(); renderCustom(); }

function showView(v) {
  $$('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  layerVisible(logMode === 'session' && !!draft);
  try { localStorage.setItem('wodlog.view', v); } catch (e) {}
}
$('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { if (b.dataset.v === 'exercises') { exSel = null; renderExercises(); } showView(b.dataset.v); window.scrollTo(0, 0); } });
$('#closeSheet').addEventListener('click', () => $('#sheet').classList.remove('on'));
$('#sheet').addEventListener('click', e => {
  if (e.target.id === 'sheet') $('#sheet').classList.remove('on');
  const r = e.target.closest('[data-rmc]');
  if (r) { settings.custom.splice(+r.dataset.rmc, 1); renderCustom(); Store.saveSettings().catch(() => {}); }
});
$('#exportData').addEventListener('click', () => {
  const data = JSON.stringify({ app:'wodlog', version:2, exported:new Date().toISOString(), sessions, settings }, null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type:'application/json' }));
  a.download = `wodlog-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  try { localStorage.setItem('wodlog.lastBackup', todayStr()); } catch (e) {}
  showBackupInfo(); toast('Backup exported');
});
$('#importData').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    const incoming = (o.sessions || o.workouts || (Array.isArray(o) ? o : [])).map(toV2);
    const byId = new Map(sessions.map(s => [s.id, s]));
    let added = 0;
    incoming.forEach(s => { const cur = byId.get(s.id); if (!cur || (s.updatedAt || 0) > (cur.updatedAt || 0)) { if (!cur) added++; byId.set(s.id, s); } });
    sessions = [...byId.values()];
    if (o.settings && Array.isArray(o.settings.custom)) { const names = new Set((settings.custom || []).map(c => norm(c.name))); o.settings.custom.forEach(c => { if (!names.has(norm(c.name))) settings.custom.push(c); }); }
    Store.persistLocal(); renderAll(); toast(`Imported — ${added} new session${added === 1 ? '' : 's'}`);
  } catch (err) { toast("That file isn't a WOD Log backup"); }
  e.target.value = '';
});
function showBackupInfo() { let d = null; try { d = localStorage.getItem('wodlog.lastBackup'); } catch (e) {} $('#backupInfo').textContent = d ? `Last backup: ${fmtDate(d)}` : 'No backup yet.'; }
showBackupInfo();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));


// boot
draft = null;
try { const raw = localStorage.getItem('wodlog.draft'); if (raw) { const o = JSON.parse(raw); if (o && o.draft && o.draft.parts) { draft = o.draft; draft.name = draft.name || ''; draft.parts = normParts(draft.parts); draft.id = draft.id || o.editingId || uid(); editingId = draft.id; logMode = 'session'; } } } catch (e) {}
renderAll(); renderLog();
try { const v = localStorage.getItem('wodlog.view'); if (v && $('#v-' + v)) showView(v); } catch (e) {}
Store.ready = Store.init();
})();
</script>
</body>
